<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魚拓アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f;
    --bg-alt: #1c1815;
    --gold: #c9a24b;
    --gold-dim: #8a7038;
    --text: #e9e2d3;
    --text-dim: #a89f8d;
    --border: #322c24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif JP", serif;
    line-height: 1.7;
    padding: 2.5rem 1.2rem 4rem;
  }
  header {
    max-width: 960px;
    margin: 0 auto 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.2rem;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    color: var(--gold);
    margin: 0 0 0.4rem;
  }
  .sub {
    font-family: "DM Mono", monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  main { max-width: 960px; margin: 0 auto; }
  .status { font-family: "DM Mono", monospace; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1rem; }
  .record {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .record .url {
    word-break: break-all;
    font-size: 1rem;
    color: var(--gold);
    text-decoration: none;
  }
  .record .url:hover { text-decoration: underline; }
  .meta {
    font-family: "DM Mono", monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 0.6rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.8rem;
  }
  .meta dt { color: var(--gold-dim); }
  .meta dd { margin: 0; word-break: break-all; }
  .actions { margin-top: 0.7rem; }
  .actions a {
    font-family: "DM Mono", monospace;
    font-size: 0.78rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.25rem 0.6rem;
    border-radius: 3px;
    text-decoration: none;
    margin-right: 0.5rem;
  }
  .actions a:hover { border-color: var(--gold-dim); color: var(--gold); }
  .empty { color: var(--text-dim); font-family: "DM Mono", monospace; }
</style>
</head>
<body>
<header>
  <h1>魚拓アーカイブ</h1>
  <div class="sub">URL / 取得日時 / 保存データ / SHA-256ハッシュ を記録</div>
</header>
<main>
  <div class="status" id="status">読み込み中...</div>
  <div id="list"></div>
</main>

<script>
async function load() {
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  try {
    const res = await fetch("archives/index.json", { cache: "no-store" });
    if (!res.ok) throw new Error("index.jsonが見つかりません");
    const records = await res.json();

    if (!records.length) {
      statusEl.textContent = "件数: 0";
      listEl.innerHTML = '<p class="empty">まだアーカイブがありません。</p>';
      return;
    }

    statusEl.textContent = `件数: ${records.length}`;

    listEl.innerHTML = records.map(r => `
      <div class="record">
        <a class="url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
        <dl class="meta">
          <dt>取得日時</dt><dd>${escapeHtml(r.fetchedAt)}</dd>
          <dt>HTTP</dt><dd>${escapeHtml(String(r.httpStatus ?? "-"))}</dd>
          <dt>SHA-256</dt><dd>${escapeHtml(r.sha256)}</dd>
          <dt>サイズ</dt><dd>${r.byteLength ? r.byteLength.toLocaleString() + " bytes" : "-"}</dd>
        </dl>
        <div class="actions">
          <a href="archives/${escapeAttr(r.file)}" target="_blank" rel="noopener">保存データを開く</a>
        </div>
      </div>
    `).join("");
  } catch (e) {
    statusEl.textContent = "読み込みに失敗しました: " + e.message;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

load();
</script>
</body>
</html>
