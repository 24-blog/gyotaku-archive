name: 魚拓 (Web Archive)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "アーカイブするページのURL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ページを取得してアーカイブ
        run: node scripts/archive.mjs "${{ github.event.inputs.url }}"

      - name: コミット & プッシュ
        run: |
          git config user.name "gyotaku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archives/
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "魚拓: ${{ github.event.inputs.url }}"
          git push
