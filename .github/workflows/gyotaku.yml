name: 魚拓 (Web Archive)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "アーカイブするページのURL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ページを取得してアーカイブ
        id: archive
        run: node scripts/archive.mjs "${{ github.event.inputs.url }}"

      - name: Pythonセットアップ (OpenTimestamps用)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: OpenTimestampsクライアントをインストール
        run: pip install opentimestamps-client

      - name: タイムスタンプを刻む(OpenTimestamps / Bitcoin)
        run: |
          ots stamp "archives/${{ steps.archive.outputs.filename }}" \
            || echo "::warning::OpenTimestampsの刻印に失敗しました(ネットワークエラー等)。後で手動で ots stamp を実行してください。"

      - name: コミット & プッシュ
        run: |
          git config user.name "gyotaku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archives/
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "魚拓: ${{ github.event.inputs.url }}"
          git push
