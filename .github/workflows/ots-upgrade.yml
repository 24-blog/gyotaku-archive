name: OpenTimestamps 確定チェック

# .ots証明は作成直後は「保留中」の状態。
# Bitcoinブロックにハッシュが取り込まれた後に ots upgrade を実行すると、
# 証明が「確定」の状態に更新される(通常は数時間〜1日程度かかる)。
# このワークフローは毎日1回、既存の全.otsファイルをアップグレードし、
# 変化があればコミットする。

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 * * *" # 毎日 UTC 18:00 (日本時間 3:00 頃)

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: OpenTimestampsクライアントをインストール
        run: pip install opentimestamps-client

      - name: 保留中の証明をアップグレード
        run: |
          shopt -s nullglob
          files=(archives/*.ots)
          if [ ${#files[@]} -eq 0 ]; then
            echo "対象の.otsファイルがありません。"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "=== $f ==="
            ots upgrade "$f" || echo "まだ確定していない、またはエラー: $f"
          done

      - name: コミット & プッシュ
        run: |
          git config user.name "gyotaku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archives/*.ots
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "OpenTimestamps: 保留中の証明をアップグレード"
          git push
